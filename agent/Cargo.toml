[package]
name = "ns8-policy-agent"
version = "1.1.0"
edition = "2021"
description = "Cross-platform policy enforcement and compliance agent for NS8 AdvancedPolicyManager"
license = "GPL-3.0-or-later"

[lib]
name = "ns8_policy_agent"
path = "src/lib.rs"

[[bin]]
name = "ns8-policy-agent"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3.12"
